name: Build BassForge

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target BassForge_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: BassForge-VST3-Windows
          path: build/BassForge_artefacts/Release/VST3/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target BassForge_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: BassForge-VST3-macOS
          path: build/BassForge_artefacts/Release/VST3/
